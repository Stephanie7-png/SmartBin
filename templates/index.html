<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBin Pro | Supervision</title>
    <style>
       
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        .navbar { background-color: #2c3e50; color: white; padding: 15px 30px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .navbar-brand { display: flex; align-items: center; gap: 15px; }
        .brand-logo { height: 50px; width: auto; border-radius: 8px; background-color: white; padding: 2px; }
        .brand-title { font-size: 1.5rem; font-weight: bold; }
        .nav-right { display: flex; align-items: center; gap: 20px; }
        .nav-status { background-color: #27ae60; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
        .btn-logout { color: #e74c3c; text-decoration: none; font-weight: bold; background: white; padding: 6px 12px; border-radius: 6px; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .tabs-container { display: flex; gap: 15px; margin-bottom: 30px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tab-btn { padding: 12px 24px; font-size: 1.05rem; font-weight: bold; background: none; border: none; cursor: pointer; color: #7f8c8d; border-radius: 8px; }
        .tab-btn.active { background-color: #3498db; color: white; }
        .stats-banner { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border-top: 4px solid #3498db; }
        .stat-number { font-size: 1.8rem; font-weight: bold; color: #2c3e50; }
        .stat-label { font-size: 0.9rem; color: #7f8c8d; text-transform: upper; }
        .bins-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .bin-card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; display: flex; flex-direction: column; justify-content: space-between; border: 2px solid transparent; min-height: 320px; }
        .bin-card.critical { border-color: #e74c3c; animation: pulse-border 2s infinite; }
        @keyframes pulse-border { 0% { box-shadow: 0 4px 15px rgba(231, 76, 60, 0.2); } 50% { box-shadow: 0 4px 25px rgba(231, 76, 60, 0.5); } 100% { box-shadow: 0 4px 15px rgba(231, 76, 60, 0.2); } }
        .alert-badge { background-color: #e74c3c; color: white; font-size: 0.8rem; font-weight: bold; padding: 6px 12px; border-radius: 20px; margin: 10px auto; display: inline-block; }
        .bin-name { font-size: 1.2rem; font-weight: 600; color: #2c3e50; }
        .bin-type { font-size: 0.85rem; color: #95a5a6; margin-bottom: 15px; text-transform: upper; }
        .progress-bar-container { background-color: #ecf0f1; border-radius: 10px; height: 25px; overflow: hidden; margin-bottom: 15px; }
        .progress-bar { height: 100%; width: 0%; transition: width 0.5s, background-color 0.5s; }
        .level-text { font-size: 1.6rem; font-weight: bold; margin-bottom: 20px; }
        .actions-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-add { background-color: #3498db; color: white; }
        .btn-empty { background-color: #95a5a6; color: white; }
        .btn-critical-empty { background-color: #27ae60; color: white; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo SmartBin" class="brand-logo" onerror="this.style.display='none'">
            <span class="brand-title">SmartBin — ({{ role | upper }})</span>
        </div>
        <div class="nav-right">
            <span class="nav-status"> {{ user }}</span>
            <a href="/logout" class="btn-logout">Déconnexion</a>
        </div>
    </nav>

    <div class="container">
        <div class="tabs-container" id="tabs-navigation">
            <button class="tab-btn active" id="tab-ville" onclick="switchPersona('ville')">  Villes & Collectivités</button>
            <button class="tab-btn" id="tab-entreprise" onclick="switchPersona('entreprise')">  Établissements & Entreprises</button>
        </div>

        <div class="stats-banner">
            <div class="stat-card"><div class="stat-label">Bacs Surveillés</div><div class="stat-number" id="stat-total">0</div></div>
            <div class="stat-card"><div class="stat-label">Remplissage Moyen</div><div class="stat-number" id="stat-avg">0%</div></div>
            <div class="stat-card"><div class="stat-label">Alertes Actives (Mail Partis)</div><div class="stat-number" id="stat-alerts">0</div></div>
        </div>

        <div class="bins-grid" id="bins-container"></div>
    </div>

    <script>
        const API_URL = `${window.location.origin}/api/bins`;
        
        // Variables injectées dynamiquement par Flask Session lors du rendu de la page
        const userRole = "{{ role }}";
        const userZone = "{{ zone }}";
        
        let currentPersona = userZone === 'all' ? 'ville' : userZone;

        // Restriction d'affichage des onglets pour les agents
        if (userRole === 'agent') {
            document.getElementById('tabs-navigation').style.display = 'none';
        }

        function getProgressBarColor(level) {
            if (level < 50) return "#2ecc71";
            if (level < 80) return "#f39c12";
            return "#e74c3c";
        }

        function switchPersona(persona) {
            currentPersona = persona;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(persona === 'ville') document.getElementById('tab-ville').classList.add('active');
            else document.getElementById('tab-entreprise').classList.add('active');
            fetchBinsData();
        }

        async function fetchBinsData() {
            try {
                const response = await fetch(API_URL);
                const allBins = await response.json();
                
                const filteredBins = allBins.filter(b => b.zone === currentPersona);
                
                const totalBins = filteredBins.length;
                const avgLevel = totalBins > 0 ? Math.round(filteredBins.reduce((sum, b) => sum + b.level, 0) / totalBins) : 0;
                const activeAlerts = filteredBins.filter(b => b.level >= 80).length;

                document.getElementById('stat-total').innerText = totalBins;
                document.getElementById('stat-avg').innerText = avgLevel + "%";
                document.getElementById('stat-alerts').innerText = activeAlerts;

                const container = document.getElementById('bins-container');
                container.innerHTML = '';

                filteredBins.forEach(bin => {
                    const isCritical = bin.level >= 80;
                    const color = getProgressBarColor(bin.level);
                    
                    container.innerHTML += `
                        <div class="bin-card ${isCritical ? 'critical' : ''}">
                            <div>
                                <div class="bin-name">${bin.name}</div>
                                <div class="bin-type">${bin.type}</div>
                                ${isCritical ? `<div class="alert-badge"> ALERTE MAIL ENVOYÉE !</div>` : ''}
                            </div>
                            <div>
                                <div class="progress-bar-container">
                                    <div class="progress-bar" style="width: ${bin.level}%; background-color: ${color};"></div>
                                </div>
                                <div class="level-text" style="color: ${color};">${bin.level}%</div>
                            </div>
                            <div class="actions-group">
                                ${userRole === 'admin' ? `<button class="btn btn-add" onclick="changeLevel(${bin.id}, ${bin.level + 10})">+10%</button>` : ''}
                                <button class="btn ${isCritical ? 'btn-critical-empty' : 'btn-empty'}" onclick="changeLevel(${bin.id}, 0)">
                                    ${isCritical ? ' RAMASSER' : 'Vider'}
                                </button>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Erreur API:", error);
            }
        }

        async function changeLevel(binId, newLevel) {
            const cleanLevel = Math.max(0, Math.min(100, newLevel));
            try {
                await fetch(`${API_URL}/${binId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ level: cleanLevel })
                });
                fetchBinsData();
            } catch (error) {
                print(error);
            }
        }

        fetchBinsData();
        setInterval(fetchBinsData, 3000);
    </script>
</body>
</html>
