<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBin | Connexion</title>
    <style>
        body {
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #2c3e50; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #7f8c8d; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 2px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; }
        .btn-login { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-login:hover { background-color: #2980b9; }
        .error { color: #e74c3c; margin-bottom: 15px; font-weight: bold; }
        .info-roles { font-size: 0.8rem; color: #95a5a6; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>SMARTBIN</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form action="/login" method="POST">
            <div class="input-group">
                <label>Utilisateur</label>
                <input type="text" name="username" required placeholder="ex: admin ou agent_ville">
            </div>
            <div class="input-group">
                <label>Mot de passe</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login">Se connecter</button>
        </form>
        <div class="info-roles">
            <strong>Démo :</strong><br>
            admin : Vue totale<br>
            agent_ville : Vue restreinte
        </div>
    </div>
</body>
</html>
